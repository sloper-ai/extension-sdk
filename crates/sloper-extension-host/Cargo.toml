[package]
name = "sloper-extension-host"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Static validation and optional execution host for Sloper extensions"
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license-file = "LICENSE"
keywords.workspace = true
categories = ["development-tools", "wasm"]
include = ["LICENSE", "build.rs", "src/**", "tests/fixtures/**"]
publish = ["crates-io"]

[[test]]
name = "host_execution"
required-features = ["runtime"]

[[test]]
name = "sdk_execution"
required-features = ["runtime"]

[[test]]
name = "release_trust"
required-features = ["runtime"]

[[test]]
name = "host_grants"
required-features = ["runtime"]

[[test]]
name = "host_limits"
required-features = ["runtime"]

[[test]]
name = "host_logging"
required-features = ["runtime"]

[[test]]
name = "host_sandbox"
required-features = ["runtime"]

[[test]]
name = "host_sources"
required-features = ["runtime"]

[[test]]
name = "host_deadlines"
required-features = ["runtime"]

[dependencies]
async-trait = { workspace = true, optional = true }
aws-lc-rs = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
semver.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = { workspace = true, optional = true }
sloper-extension-spec.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
time = { workspace = true, optional = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"], optional = true }
tokio-util = { workspace = true, optional = true }
wasmparser.workspace = true
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }
wasmtime-wasi-http = { workspace = true, optional = true }
wit-component.workspace = true
wit-parser.workspace = true
zeroize = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
wat.workspace = true
wit-component = { workspace = true, features = ["dummy-module"] }

[build-dependencies]
sloper-extension-spec.workspace = true

[features]
default = []
runtime = ["dep:async-trait", "dep:aws-lc-rs", "dep:base64", "dep:ed25519-dalek", "dep:sha2", "dep:tempfile", "dep:time", "dep:tokio", "dep:tokio-util", "dep:wasmtime", "dep:wasmtime-wasi", "dep:wasmtime-wasi-http", "dep:zeroize"]

[lints]
workspace = true
