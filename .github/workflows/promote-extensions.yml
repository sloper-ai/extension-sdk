name: Promote extensions

on:
  workflow_call:
    inputs:
      sdk-revision:
        required: true
        type: string
      visibility:
        required: true
        type: string
      run-id:
        required: true
        type: string

permissions: {}

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    concurrency:
      group: extension-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_REPOSITORY: ${{ github.repository }}
      SDK_REVISION: ${{ inputs.sdk-revision }}
      DELIVERY_RUN_ID: ${{ inputs.run-id }}
      VISIBILITY: ${{ inputs.visibility }}
      API_URL: ${{ vars.SLOPER_API_URL }}
      STAGING_API_URL: ${{ vars.SLOPER_STAGING_API_URL }}
    steps:
      - name: Check out trusted publication tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sloper-ai/extension-sdk
          ref: ${{ inputs.sdk-revision }}
          path: sdk
          persist-credentials: false
      - name: Install pinned publication tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.9.3
          working_directory: sdk
      - name: Build publication tooling without credentials
        working-directory: sdk
        run: |
          cargo build --locked --package sloper-extension-cli --bin sloper-extension
          python -m unittest discover -s scripts/ci -p 'test_*.py'
      - id: candidate
        name: Verify successful main delivery and artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python sdk/scripts/ci/extensions.py resolve
          --repository "$SOURCE_REPOSITORY" --sdk-revision "$SDK_REVISION" --run-id "$DELIVERY_RUN_ID"
          --visibility "$VISIBILITY" --output selected-run.json
      - name: Download original tested components
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run-id }}
          name: extension-candidates-${{ inputs.run-id }}-${{ steps.candidate.outputs.attempt }}
          path: candidates
          digest-mismatch: error
      - name: Download original staging receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run-id }}
          name: extension-staging-receipt-${{ inputs.run-id }}-${{ steps.candidate.outputs.receipt_attempt }}
          path: staging-receipt
          digest-mismatch: error
      - name: Publish original bytes to production
        env:
          SOURCE_REVISION: ${{ steps.candidate.outputs.revision }}
          DELIVERY_ATTEMPT: ${{ steps.candidate.outputs.attempt }}
          SLOPER_API_TOKEN: ${{ secrets.SLOPER_API_TOKEN }}
        run: >-
          python sdk/scripts/ci/extensions.py publish --artifact candidates
          --tool "$GITHUB_WORKSPACE/sdk/target/debug/sloper-extension"
          --repository "$SOURCE_REPOSITORY" --revision "$SOURCE_REVISION" --sdk-revision "$SDK_REVISION"
          --run-id "$DELIVERY_RUN_ID" --attempt "$DELIVERY_ATTEMPT" --visibility "$VISIBILITY"
          --environment production --api-url "$API_URL" --receipt receipts/production.json
          --staging-receipt staging-receipt/staging.json --staging-api-url "$STAGING_API_URL"
      - name: Retain production receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-production-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipts
          if-no-files-found: warn
          retention-days: 90
